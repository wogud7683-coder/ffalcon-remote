name: Build FFALCON Remote APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download Android TV Remote source
        run: |
          git clone --depth 1 https://github.com/SebghatYusuf/android_remote.git app

      - name: Add power button
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/lib/src/ui/tv_remote_screen.dart")
          s = p.read_text()

          needle = "_Btn(icon: Icons.home_rounded,       label: 'HOME',  onTap: () => n.sendKeyPress(3)),"

          replacement = """_Btn(icon: Icons.power_settings_new_rounded, label: 'POWER', onTap: () => n.sendKeyPress(26)),
                """ + needle

          if needle not in s:
              raise SystemExit("HOME button not found")

          p.write_text(s.replace(needle, replacement, 1))
          PY

      - name: Update Gradle
        run: |
          sed -i 's/gradle-8.13-bin.zip/gradle-8.14-bin.zip/' app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk FFALCON_Remote_FF32S55_Power.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FFALCON-Remote-APK-Power
          path: FFALCON_Remote_FF32S55_Power.apk
          if-no-files-found: error
