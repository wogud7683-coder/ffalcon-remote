name: Build FFALCON Remote APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download Android TV Remote source
        run: |
          git clone --depth 1 https://github.com/SebghatYusuf/android_remote.git app

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk FFALCON_Remote_FF32S55.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FFALCON-Remote-APK
          path: FFALCON_Remote_FF32S55.apk
          if-no-files-found: error
